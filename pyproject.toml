[project]
name = "orbust"
version = "0.1.0"
description = "Modular event-driven algorithmic trading platform — 390OrBust v2"
requires-python = ">=3.12"
authors = [{ name = "fahdad" }]

dependencies = [
    "torch>=2.10",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=25",
    "typer>=0.15",
    "scikit-learn>=1.6",
    "alpaca-py>=0.35",
    "orjson>=3.10",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "tzdata>=2025.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "ruff>=0.15",
    "mypy>=1.20",
    "hypothesis>=6",
    "pre-commit>=4",
    "marimo>=0.12",
    "ipykernel>=6",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.27",
    "mkdocs-material>=9.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbust"]

[tool.hatch.build.targets.sdist]
only-include = ["src/orbust", "config", "strategies"]

# ==============================================================================
# Ruff — linting + formatting in one tool
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "ARG",     # flake8-unused-arguments
    "C4",      # flake8-comprehensions
    "RUF",     # ruff-specific
]
ignore = [
    "B008",    # allow function calls in defaults (common FastAPI/Pydantic pattern)
    "UP042",   # allow exceptions with no args
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "ARG"]

# ==============================================================================
# mypy — strict typing for pipeline correctness
# ==============================================================================
[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
enable_error_code = ["redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["alpaca_py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pyarrow.parquet.*"]
ignore_missing_imports = true
allow_untyped_calls = true

# ==============================================================================
# pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]
addopts = [
    "-v",
    "--strict-config",
    "--strict-markers",
    "-p", "no:cacheprovider",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "integration: marks tests that hit external APIs",
]

# ==============================================================================
# Coverage
# ==============================================================================
[tool.coverage.run]
source = ["orbust"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80

# ==============================================================================
# Hatch build config
# ==============================================================================
[tool.hatch.metadata]
allow-direct-references = true
