phase_2_work_items:
  - id: WI-2.1
    title: Define DataProvider abstract base class
    module: data
    status: not_started
    depends_on: []
    objective: A concrete ABC exists that all data providers must implement, with clear method signatures matching the architectural spec
    files_to_create:
      - src/orbust/data/provider.py
    files_to_modify:
      - src/orbust/data/__init__.py
    tests_to_create:
      - tests/unit/data/test_provider.py
    context_files:
      - src/orbust/types.py
      - src/orbust/config.py
      - src/orbust/data/__init__.py
    interface_contract:
      class: DataProvider
      methods:
        - name: get_bars
          signature: "(self, symbols: list[str], start: datetime, end: datetime, timeframe: Timeframe) -> pd.DataFrame"
          returns: "Wide-format DataFrame with UTC DatetimeIndex, columns named {SYM}_{field}"
        - name: stream_bars
          signature: "(self, symbols: list[str], timeframe: Timeframe) -> Iterator[BarEvent]"
          returns: "Iterator yielding BarEvent objects"
        - name: available_fields
          signature: "(self) -> list[str]"
          returns: "List of field name strings this provider offers"
      exported_from: src/orbust/data/provider.py
    acceptance_criteria:
      - DataProvider cannot be instantiated directly (raises TypeError)
      - A subclass that implements all three methods can be instantiated
      - A subclass missing any method raises TypeError on instantiation
      - get_bars return type annotation is pd.DataFrame
      - stream_bars return type annotation is Iterator[BarEvent]
      - available_fields return type annotation is list[str]
      - DataProvider is importable from orbust.data
      - Module passes mypy --strict type checking
    validation:
      - pytest tests/unit/data/test_provider.py -v
      - python -c "from orbust.data import DataProvider"
      - mypy src/orbust/data/provider.py --strict
    non_goals:
      - Any concrete implementation
      - Caching logic
      - RTH filtering
    review_group: data-foundation
    risk_level: low
    estimated_lines: 65

  - id: WI-2.2
    title: Implement Parquet store writer and reader
    module: data
    status: not_started
    depends_on:
      - WI-2.1
    objective: A ParquetStore class can write wide-format DataFrames to partitioned Parquet files and read them back with date-range filtering
    files_to_create:
      - src/orbust/data/store.py
      - tests/unit/data/test_store.py
    files_to_modify:
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/types.py
      - src/orbust/config.py
      - src/orbust/data/provider.py
      - tests/conftest.py
    interface_contract:
      class: ParquetStore
      constructor: "(self, base_dir: Path, timeframe: Timeframe)"
      methods:
        - name: write
          signature: "(self, df: pd.DataFrame, symbols: list[str]) -> Path"
          returns: "Path to written Parquet file"
        - name: read
          signature: "(self, symbols: list[str], start: datetime, end: datetime) -> pd.DataFrame | None"
          returns: "Wide-format DataFrame or None if no data exists"
        - name: get_cached_ranges
          signature: "(self, symbols: list[str]) -> list[tuple[datetime, datetime]]"
          returns: "List of (start, end) tuples representing cached date ranges"
        - name: find_missing_ranges
          signature: "(self, symbols: list[str], start: datetime, end: datetime) -> list[tuple[datetime, datetime]]"
          returns: "List of (start, end) tuples not yet cached"
      exported_from: src/orbust/data/store.py
    acceptance_criteria:
      - write() creates a Parquet file at predictable path based on timeframe and date
      - read() returns DataFrame with UTC DatetimeIndex
      - read() returns None when no cached data exists
      - read() filters to requested date range
      - Written and read DataFrames are equal (round-trip fidelity)
      - Column names follow {SYM}_{field} wide format
      - DatetimeIndex is timezone-aware UTC after read
      - get_cached_ranges returns correct ranges after writes
      - find_missing_ranges correctly identifies gaps
      - ParquetStore is importable from orbust.data
    validation:
      - pytest tests/unit/data/test_store.py -v
      - python -c "from orbust.data import ParquetStore"
    non_goals:
      - SQLite metadata tracking
      - Concurrent write safety
      - Compression tuning
    review_group: data-foundation
    risk_level: low
    estimated_lines: 180

  - id: WI-2.3
    title: Implement Alpaca bar fetcher with pagination and rate limiting
    module: data
    status: not_started
    depends_on:
      - WI-2.1
    objective: An AlpacaFetcher class can retrieve historical bars from Alpaca API with proper pagination, rate limiting, and error handling
    files_to_create:
      - src/orbust/data/alpaca.py
      - tests/unit/data/test_alpaca_fetch.py
    files_to_modify:
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/types.py
      - src/orbust/config.py
      - src/orbust/log.py
      - src/orbust/data/provider.py
    interface_contract:
      class: AlpacaFetcher
      constructor: "(self, config: AlpacaConfig, logger: BoundLogger | None = None)"
      methods:
        - name: fetch_bars
          signature: "(self, symbols: list[str], start: datetime, end: datetime, timeframe: Timeframe) -> pd.DataFrame"
          returns: "Wide-format DataFrame with UTC DatetimeIndex"
        - name: _paginate
          signature: "(self, symbol: str, start: datetime, end: datetime, timeframe: Timeframe) -> list[dict]"
          returns: "List of raw bar dicts from Alpaca"
      rate_limiting: "Respects 200 requests/minute limit with exponential backoff"
      exported_from: src/orbust/data/alpaca.py
    acceptance_criteria:
      - fetch_bars returns wide-format DataFrame with {SYM}_{field} columns
      - DatetimeIndex is UTC-aware
      - Pagination handles next_page_token correctly (tested with mock)
      - Rate limiter sleeps when approaching limit (tested with mock)
      - HTTP 429 triggers exponential backoff retry
      - HTTP 4xx/5xx raises descriptive AlpacaFetchError
      - All Alpaca HTTP calls go through a single _request method (mockable)
      - Timeframe enum maps correctly to Alpaca API timeframe strings
      - Empty response returns empty DataFrame with correct columns
      - Logger records fetch start, page count, total bars fetched
    validation:
      - pytest tests/unit/data/test_alpaca_fetch.py -v
      - python -c "from orbust.data.alpaca import AlpacaFetcher"
    non_goals:
      - Caching (handled by provider layer)
      - RTH filtering
      - Streaming/websocket
      - Real API calls in unit tests
    review_group: alpaca-integration
    risk_level: medium
    estimated_lines: 220

  - id: WI-2.4
    title: Implement RTH filtering utility
    module: data
    status: not_started
    depends_on:
      - WI-2.1
    objective: A reusable RTH filter function removes bars outside regular trading hours (09:30-16:00 ET, Mon-Fri) from any wide-format DataFrame
    files_to_create:
      - src/orbust/data/rth.py
      - tests/unit/data/test_rth.py
    files_to_modify:
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/types.py
      - tests/conftest.py
    interface_contract:
      functions:
        - name: filter_rth
          signature: "(df: pd.DataFrame) -> pd.DataFrame"
          returns: "DataFrame with only RTH bars"
        - name: is_rth
          signature: "(timestamp: datetime) -> bool"
          returns: "True if timestamp falls within RTH"
        - name: get_rth_minutes
          signature: "(date: date) -> list[datetime]"
          returns: "List of all RTH minute timestamps for a given date"
      constants:
        RTH_START_ET: "time(9, 30)"
        RTH_END_ET: "time(16, 0)"
      exported_from: src/orbust/data/rth.py
    acceptance_criteria:
      - filter_rth removes pre-market bars (before 09:30 ET)
      - filter_rth removes after-hours bars (at or after 16:00 ET)
      - filter_rth removes weekend bars
      - filter_rth preserves bar at exactly 09:30 ET
      - filter_rth removes bar at exactly 16:00 ET (last bar is 15:59)
      - Works correctly across DST transitions (EST/EDT)
      - Input DataFrame with UTC index is handled correctly
      - Returns DataFrame with same column structure
      - Empty DataFrame input returns empty DataFrame
      - is_rth correctly classifies edge-case timestamps
      - get_rth_minutes returns exactly 390 timestamps for a trading day
    validation:
      - pytest tests/unit/data/test_rth.py -v
      - python -c "from orbust.data.rth import filter_rth, is_rth"
    non_goals:
      - Holiday calendar (treat holidays as regular weekdays for now)
      - Half-day handling
      - Extended hours configuration
    review_group: alpaca-integration
    risk_level: low
    estimated_lines: 85

  - id: WI-2.5
    title: Implement AlpacaBarProvider with caching and RTH integration
    module: data
    status: not_started
    depends_on:
      - WI-2.2
      - WI-2.3
      - WI-2.4
    objective: A complete DataProvider implementation that fetches from Alpaca, caches to Parquet, applies RTH filtering, and only re-fetches missing ranges
    files_to_create:
      - tests/unit/data/test_alpaca_provider.py
    files_to_modify:
      - src/orbust/data/alpaca.py
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/data/provider.py
      - src/orbust/data/store.py
      - src/orbust/data/rth.py
      - src/orbust/config.py
      - src/orbust/log.py
    interface_contract:
      class: AlpacaBarProvider
      inherits: DataProvider
      constructor: "(self, config: SystemConfig, rth_only: bool = True)"
      methods:
        - name: get_bars
          signature: "(self, symbols: list[str], start: datetime, end: datetime, timeframe: Timeframe) -> pd.DataFrame"
          behavior: "Check cache -> fetch missing ranges -> cache new data -> apply RTH if configured -> return merged result"
        - name: stream_bars
          signature: "(self, symbols: list[str], timeframe: Timeframe) -> Iterator[BarEvent]"
          behavior: "Placeholder that raises NotImplementedError for Phase 2"
        - name: available_fields
          signature: "(self) -> list[str]"
          returns: "['open', 'high', 'low', 'close', 'volume', 'trade_count', 'vwap']"
      exported_from: src/orbust/data.alpaca
    acceptance_criteria:
      - AlpacaBarProvider is a valid DataProvider subclass
      - get_bars returns cached data without calling Alpaca API when fully cached
      - get_bars fetches only missing date ranges when partially cached
      - get_bars caches fetched data to Parquet automatically
      - RTH filtering applied when rth_only=True
      - RTH filtering skipped when rth_only=False
      - Returned DataFrame has UTC DatetimeIndex
      - Returned DataFrame has {SYM}_{field} column format
      - available_fields returns all 7 bar fields
      - stream_bars raises NotImplementedError
      - Temporal alignment verified (all symbols have same timestamps)
      - Logger records cache hit/miss statistics
    validation:
      - pytest tests/unit/data/test_alpaca_provider.py -v
      - python -c "from orbust.data import AlpacaBarProvider"
    non_goals:
      - Live streaming implementation
      - Concurrent symbol fetching
      - Background refresh
    review_group: alpaca-integration
    risk_level: medium
    estimated_lines: 160

  - id: WI-2.6
    title: Implement data quality checks
    module: data
    status: not_started
    depends_on:
      - WI-2.1
      - WI-2.4
    objective: A quality module detects gaps, duplicates, and timestamp anomalies in bar DataFrames and returns structured reports
    files_to_create:
      - src/orbust/data/quality.py
      - tests/unit/data/test_quality.py
    files_to_modify:
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/types.py
      - src/orbust/data/rth.py
      - tests/conftest.py
    interface_contract:
      class: QualityReport
      fields:
        - name: gaps
          type: "list[GapInfo]"
          description: "Missing bars within expected trading hours"
        - name: duplicates
          type: "list[datetime]"
          description: "Timestamps appearing more than once"
        - name: timestamp_issues
          type: "list[TimestampIssue]"
          description: "Non-UTC, non-aligned, or out-of-order timestamps"
        - name: is_clean
          type: bool
          description: "True if no issues found"
      dataclass: GapInfo
      gap_fields:
        - symbol: str
        - gap_start: datetime
        - gap_end: datetime
        - missing_bars: int
      dataclass: TimestampIssue
      issue_fields:
        - timestamp: datetime
        - issue_type: str
        - detail: str
      functions:
        - name: check_quality
          signature: "(df: pd.DataFrame, timeframe: Timeframe, rth_only: bool = True) -> QualityReport"
        - name: detect_gaps
          signature: "(df: pd.DataFrame, timeframe: Timeframe, rth_only: bool = True) -> list[GapInfo]"
        - name: detect_duplicates
          signature: "(df: pd.DataFrame) -> list[datetime]"
        - name: validate_timestamps
          signature: "(df: pd.DataFrame) -> list[TimestampIssue]"
      exported_from: src/orbust/data/quality.py
    acceptance_criteria:
      - detect_gaps finds missing bars within RTH when rth_only=True
      - detect_gaps does not flag overnight gaps as issues
      - detect_gaps does not flag weekend gaps as issues
      - detect_duplicates identifies repeated timestamps
      - validate_timestamps flags non-UTC-aware timestamps
      - validate_timestamps flags timestamps not aligned to timeframe boundary
      - validate_timestamps flags out-of-order timestamps
      - check_quality aggregates all checks into QualityReport
      - QualityReport.is_clean is True when no issues exist
      - Works with wide-format DataFrames
      - GapInfo includes correct missing_bars count
      - All dataclasses are importable from orbust.data.quality
    validation:
      - pytest tests/unit/data/test_quality.py -v
      - python -c "from orbust.data.quality import check_quality, QualityReport"
    non_goals:
      - Auto-repair of data issues
      - Statistical outlier detection
      - Volume anomaly detection
    review_group: data-quality
    risk_level: low
    estimated_lines: 175

  - id: WI-2.7
    title: Implement data pipeline integration tests
    module: data
    status: not_started
    depends_on:
      - WI-2.5
      - WI-2.6
    objective: Integration tests verify the full pipeline from fetch through cache through quality check, using mocked Alpaca responses with realistic data
    files_to_create:
      - tests/integration/data/test_data_pipeline.py
      - tests/integration/data/conftest.py
      - tests/fixtures/alpaca_response_sample.json
    files_to_modify: []
    context_files:
      - src/orbust/data/alpaca.py
      - src/orbust/data/store.py
      - src/orbust/data/quality.py
      - src/orbust/data/rth.py
      - src/orbust/config.py
      - tests/conftest.py
    interface_contract:
      test_scenarios:
        - name: test_full_fetch_cache_read_cycle
          verifies: "Fetch -> write Parquet -> read back -> data matches"
        - name: test_partial_cache_refetch
          verifies: "Cached range + missing range -> only missing fetched"
        - name: test_rth_filtering_end_to_end
          verifies: "Raw data with extended hours -> filtered to 390 bars/day"
        - name: test_quality_on_clean_data
          verifies: "Clean fetched data passes all quality checks"
        - name: test_quality_on_gapped_data
          verifies: "Data with intentional gaps detected correctly"
        - name: test_multi_symbol_temporal_alignment
          verifies: "Multiple symbols share identical timestamp index"
        - name: test_dst_transition_handling
          verifies: "Data spanning DST change has correct RTH boundaries"
    acceptance_criteria:
      - All 7 integration test scenarios pass
      - Tests use mocked HTTP responses (no real Alpaca calls)
      - Fixture JSON contains realistic multi-page Alpaca response
      - Tests exercise ParquetStore with real filesystem (tmp_path)
      - Cache hit path verified (second call does not trigger fetch)
      - Quality report on pipeline output shows is_clean=True
      - DST test covers both spring-forward and fall-back
      - Tests complete in under 10 seconds
    validation:
      - pytest tests/integration/data/ -v --timeout=30
      - pytest tests/ -v --timeout=60
    non_goals:
      - Real Alpaca API calls
      - Performance benchmarking
      - Load testing
    review_group: data-quality
    risk_level: medium
    estimated_lines: 280

  - id: WI-2.8
    title: Create data exploration notebook helper
    module: data
    status: not_started
    depends_on:
      - WI-2.5
      - WI-2.6
    objective: A notebook-friendly helper module provides one-liner functions for fetching, inspecting, and visualizing bar data in Jupyter
    files_to_create:
      - src/orbust/data/notebook.py
      - notebooks/data_exploration.py
      - tests/unit/data/test_notebook_helpers.py
    files_to_modify:
      - src/orbust/data/__init__.py
    context_files:
      - src/orbust/data/alpaca.py
      - src/orbust/data/quality.py
      - src/orbust/config.py
    interface_contract:
      functions:
        - name: quick_fetch
          signature: "(symbols: list[str], days_back: int = 5, timeframe: Timeframe = Timeframe.MINUTE_1) -> pd.DataFrame"
          returns: "Wide-format DataFrame ready for analysis"
        - name: summarize
          signature: "(df: pd.DataFrame) -> pd.DataFrame"
          returns: "Summary stats per symbol: count, gaps, date range, completeness %"
        - name: check
          signature: "(df: pd.DataFrame, timeframe: Timeframe = Timeframe.MINUTE_1) -> QualityReport"
          returns: "Quality report with pretty __repr__"
      exported_from: src/orbust/data.notebook
    acceptance_criteria:
      - quick_fetch creates provider from default config and returns DataFrame
      - summarize returns per-symbol statistics DataFrame
      - check wraps quality.check_quality with sensible defaults
      - All functions have docstrings suitable for help() in notebook
      - notebook.py importable without side effects
      - notebooks/data_exploration.py is a valid Python script (percent format)
      - Test verifies summarize output shape and columns
      - Test verifies check returns QualityReport instance
    validation:
      - pytest tests/unit/data/test_notebook_helpers.py -v
      - python -c "from orbust.data.notebook import quick_fetch, summarize, check"
      - python -c "import ast; ast.parse(open('notebooks/data_exploration.py').read())"
    non_goals:
      - Matplotlib/plotly visualization (deferred)
      - Interactive widgets
      - Auto-display in notebook
    review_group: data-quality
    risk_level: low
    estimated_lines: 120
